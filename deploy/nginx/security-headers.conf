add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "SAMEORIGIN" always;
add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;

# CSP en mode REPORT-ONLY durant la v1.
# `upgrade-insecure-requests` no s'inclou perquè el navegador l'ignora en una
# política Report-Only (genera un error a consola). Cal afegir-lo quan la CSP
# passi a enforcing.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://cloud.umami.is https://api.web3forms.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.google.com; form-action 'self' https://api.web3forms.com" always;
