server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    # --- Compressió -------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml application/rss+xml
               image/svg+xml font/woff2;

    # --- Healthcheck de Dokploy -------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Headers de seguretat (nivell servidor) ---------------------
    include /etc/nginx/snippets/security-headers.conf;

    # --- Redirects llegat (301/410) --------------------------------
    include /etc/nginx/snippets/redirects.conf;

    # --- Assets amb hash: cache immutable ---------------------------
    # `^~` evita que les expressions regulars d'imatges i fonts tinguin
    # prioritat sobre aquest bloc: tot el que hi ha a `_astro/` porta hash
    # al nom i pot cachejar-se per sempre.
    # Un `add_header` dins d'un location trenca l'herència del servidor,
    # per això re-incloem el snippet de seguretat.
    location ^~ /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Imatges (noms estables) -----------------------------------
    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # --- Fonts ------------------------------------------------------
    location ~* \.(?:woff2?|ttf|otf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- PDFs (fitxes, manuals, garanties) -------------------------
    location ~* \.pdf$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- Sitemap, RSS i robots: revalidació diària ------------------
    location ~* ^/(sitemap.*\.xml|rss\.xml|robots\.txt)$ {
        expires 1d;
        try_files $uri =404;
    }

    # --- HTML: sempre revalidat ------------------------------------
    # Astro build.format=directory → /nosotros/index.html.
    # nginx respon 301 /nosotros → /nosotros/ quan el directori existeix.
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    # --- 404 propi --------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires epoch;
    }
}
