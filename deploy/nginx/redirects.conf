# --- WordPress llegat ----------------------------------------------
location = /hello-world/                { return 301 /blog/; }
location = /category/uncategorized/     { return 301 /blog/; }
location ^~ /category/                  { return 301 /blog/; }

# Sitemaps antics de Yoast → sitemap nou (evita errors a Search Console)
location ~ ^/(sitemap_index\.xml|wp-sitemap\.xml|page-sitemap\.xml|post-sitemap\.xml|category-sitemap\.xml)$ {
    return 301 /sitemap-index.xml;
}

# --- Rutes catalanes antigues --------------------------------------
location = /ca/nosotros/                { return 301 /nosotros/; }
location = /ca/gracies/                 { return 301 /gracias/; }
location ^~ /ca/                        { return 301 /; }

# --- Slugs catalans → castellans -----------------------------------
location = /avis-legal/                 { return 301 /aviso-legal/; }
location = /politica-de-privacitat/     { return 301 /politica-de-privacidad/; }
location = /politica-de-cookies-ue/     { return 301 /politica-de-cookies/; }

# --- Superfície WordPress: fora (410 Gone) -------------------------
location ^~ /wp-admin/                  { return 410; }
location ^~ /wp-login                   { return 410; }
location ^~ /wp-includes/               { return 410; }
location ^~ /wp-json/                   { return 410; }
location = /xmlrpc.php                  { return 410; }
location ~ ^/.+/feed/?$                 { return 410; }
location ^~ /feed/                      { return 410; }

# --- Directoris interns / staging ----------------------------------
location ^~ /dev/                       { return 410; }
location ^~ /old_web/                   { return 410; }
location ^~ /firma-email/               { return 410; }
